name = "mathbattles-server"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "RoomObject" },
  { name = "MATCHMAKER", class_name = "MatchmakerObject" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject", "MatchmakerObject"]

[[d1_databases]]
binding = "DB"
database_name = "mathbattles"
database_id = "36e3b37d-5c46-48c7-b0b6-6c7dbfe0f5a2"
migrations_dir = "migrations"

[triggers]
# Daily cleanup; a new ranked season starts on the 1st of every third month.
crons = ["0 3 * * *"]

[vars]
FIREBASE_PROJECT_ID = "mathbattles-98eee"
# The public web key, also present in the code of the site.
FIREBASE_API_KEY = "AIzaSyAEpVeNtZMpX-mj_iVvGJ0Fmy_1XhBGCKQ"
ALLOWED_ORIGINS = "https://mathbattles.github.io"
