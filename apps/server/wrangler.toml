name = "mathbattles-server"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "RoomObject" },
  { name = "MATCHMAKER", class_name = "MatchmakerObject" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject", "MatchmakerObject"]

[[d1_databases]]
binding = "DB"
database_name = "mathbattles"
# Replaced with the real id when the database is created on first deploy.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
# Daily cleanup; a new ranked season starts on the 1st of every third month.
crons = ["0 3 * * *"]

[vars]
FIREBASE_PROJECT_ID = "mathbattles-98eee"
ALLOWED_ORIGINS = "https://mathbattles.github.io,http://localhost:5173"
